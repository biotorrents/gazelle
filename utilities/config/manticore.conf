$requestsQuery = static function(string $where) {
	return "select \
		requests.id as requests_id, \
		requests.categoryId as requests_categoryId, \
		requests.userId as requests_userId, \
		requests.groupId as requests_groupId, \
		requests.torrentId as requests_torrentId, \
		requests.filledById as requests_filledById, \
		unix_timestamp(requests.filledAt) as requests_filledAt, \
		unix_timestamp(requests.lastVote) as requests_lastVote, \
		requests.identifier as requests_identifier, \
		requests.title as requests_title, \
		requests.slug as requests_slug, \
		requests.subject as requests_subject, \
		requests.object as requests_object, \
		requests.description as requests_description, \
		requests.picture as requests_picture, \
		unix_timestamp(requests.created_at) as requests_createdAt, \
		unix_timestamp(requests.updated_at) as requests_updatedAt, \
		unix_timestamp(requests.deleted_at) as requests_deletedAt, \
		tags.id as tags_id, \
		tags.name as tags_name, \
		tags.tagType as tags_tagType, \
		tags.uses as tags_useCount, \
		tags.userId as tags_userId, \
		unix_timestamp(tags.created_at) as tags_createdAt, \
		unix_timestamp(tags.updated_at) as tags_updatedAt, \
		unix_timestamp(tags.deleted_at) as tags_deletedAt, \
		creators.id as creators_id, \
		creators.orcid as creators_orcid, \
		creators.semanticScholarId as creators_semanticScholarId, \
		creators.name as creators_name, \
		creators.slug as creators_slug, \
		creators.description as creators_description, \
		creators.aliases as creators_aliases, \
		creators.affiliations as creators_affiliations, \
		creators.homepage as creators_homepage, \
		creators.picture as creators_picture, \
		creators.hIndex as creators_hIndex, \
		creators.paperCount as creators_paperCount, \
		creators.citationCount as creators_citationCount, \
		creators.failCount as creators_failCount, \
		creators.degreesOfSeparation as creators_degreesOfSeparation, \
		unix_timestamp(creators.created_at) as creators_createdAt, \
		unix_timestamp(creators.updated_at) as creators_updatedAt, \
		unix_timestamp(creators.deleted_at) as creators_deletedAt, \
		count(requests_votes.requestId) as voteCount, \
		sum(requests_votes.bounty) as bounty \
from requests \
		left join requests_links on requests_links.objectId = requests.id \
		left join tags on tags.id = requests_links.contentId and requests_links.contentType = 'tags' \
		left join creators on creators.id = requests_links.contentId and requests_links.contentType = 'creators' \
		left join requests_votes on requests_votes.requestId = requests.id \
	where {$where} and requests.deleted_at is null \
	group by requests.id";
}

