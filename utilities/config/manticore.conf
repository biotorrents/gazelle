# --
#
# crontab entries: root@manticore.torrents.bio
# these run on a dedicated manticore host
#
# rotate deltas every minute
# */1 * * * * sudo -u manticore indexer --rotate torrents_group_delta --quiet
# */1 * * * * sudo -u manticore indexer --rotate requests_delta --quiet
# */1 * * * * sudo -u manticore indexer --rotate collages_delta --quiet
# */1 * * * * sudo -u manticore indexer --rotate creators --quiet
# */1 * * * * sudo -u manticore indexer --rotate literature --quiet
# */1 * * * * sudo -u manticore indexer --rotate organizations --quiet
#
# merge deltas every 15 minutes
# */15 * * * * sudo -u manticore indexer --merge torrents_group_main torrents_group_delta --rotate --quiet
# */15 * * * * sudo -u manticore indexer --merge requests_main requests_delta --rotate --quiet
# */15 * * * * sudo -u manticore indexer --merge collages_main collages_delta --rotate --quiet
# */15 * * * * sudo -u manticore indexer --merge creators_main creators_delta --rotate --quiet
# */15 * * * * sudo -u manticore indexer --merge literature_main literature_delta --rotate --quiet
# */15 * * * * sudo -u manticore indexer --merge organizations_main organizations_delta --rotate --quiet
#
# rotate all every hour
# 30 * * * * sudo -u manticore indexer --rotate --all --quiet
#

common {
	plugin_dir = /usr/local/lib/manticore
}

searchd {
	listen =
	log = /var/log/manticore/searchd.log
	pid_file = /var/run/manticore/searchd.pid
	binlog_path = /var/lib/manticore

	# https://manual.manticoresearch.com/Telemetry
	telemetry = 0
}

indexer {
	mem_limit = 2047M # half the hetzner memory
}


##
# database_connection
#

source database_connection {
	type = mysql

	sql_host =
	sql_port =

	sql_db =
	sql_user =
	sql_pass =

	sql_query_pre = set character_set_results=utf8mb4
	sql_query_pre = set names utf8mb4
	sql_query_pre = set session query_cache_type=off
}


